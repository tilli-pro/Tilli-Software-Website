    <script>
        // Old blog page specific JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // Load blog posts data
            const postsData = JSON.parse(document.getElementById('blog-posts-data').textContent);
            const allPostsGrid = document.getElementById('all-posts-grid');
            const loadMoreBtn = document.getElementById('load-more-btn');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const searchInput = document.querySelector('.search-input');
            
            let allPosts = postsData.posts;
            let currentFilter = 'all';
            let currentSearch = '';
            let postsPerPage = 12;
            let currentPage = 1;
            let displayedPosts = 0;

            // Generate all posts
            function generateAllPosts(posts = allPosts, reset = true) {
                if (reset) {
                    allPostsGrid.innerHTML = '';
                    displayedPosts = 0;
                    currentPage = 1;
                }

                // Filter posts based on current filter and search
                let filteredPosts = posts;
                if (currentFilter !== 'all') {
                    filteredPosts = filteredPosts.filter(post => post.category === currentFilter);
                }
                if (currentSearch) {
                    filteredPosts = filteredPosts.filter(post => 
                        post.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                        post.description.toLowerCase().includes(currentSearch.toLowerCase())
                    );
                }

                // Sort by date (newest first)
                filteredPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

                // Get posts for current page
                const startIndex = displayedPosts;
                const endIndex = Math.min(startIndex + postsPerPage, filteredPosts.length);
                const postsToShow = filteredPosts.slice(startIndex, endIndex);

                // Generate post cards
                postsToShow.forEach(post => {
                    const postCard = document.createElement('article');
                    postCard.className = 'post-card';
                    postCard.innerHTML = `
                        <a href="${post.href}" class="post-link">
                            <div class="post-image">
                                <img src="${post.image}" alt="${post.title}">
                            </div>
                            <div class="post-content">
                                <span class="post-category">${post.category.toUpperCase().replace('-', ' ')}</span>
                                <h3 class="post-title">${post.title}</h3>
                                <p class="post-excerpt">${post.description}</p>
                                <div class="post-meta">
                                    <span class="post-author">${post.author}</span>
                                    <span class="post-date">${post.date}</span>
                                    <span class="post-read-time">5 min read</span>
                                </div>
                            </div>
                        </a>
                    `;
                    allPostsGrid.appendChild(postCard);
                });

                displayedPosts = endIndex;

                // Update load more button
                if (displayedPosts >= filteredPosts.length) {
                    loadMoreBtn.style.display = 'none';
                } else {
                    loadMoreBtn.style.display = 'block';
                }
            }

            // Initialize posts
            generateAllPosts();

            // Filter functionality
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remove active class from all buttons
                    filterBtns.forEach(b => b.classList.remove('active'));
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    const filter = this.getAttribute('data-filter');
                    currentFilter = filter;
                    
                    // Generate filtered posts
                    generateAllPosts();
                });
            });

            // Search functionality
            searchInput.addEventListener('input', function() {
                currentSearch = this.value;
                generateAllPosts();
            });

            // Load more functionality
            loadMoreBtn.addEventListener('click', function() {
                generateAllPosts(allPosts, false);
            });
        });
    </script>

    <!-- Fallback mobile menu functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            const dropdowns = document.querySelectorAll('.dropdown');
            
            console.log('Mobile menu elements:', { hamburger, navMenu, dropdowns });
            
            if (hamburger && navMenu) {
                // Toggle mobile menu
                hamburger.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Hamburger clicked');
                    
                    hamburger.classList.toggle('active');
                    navMenu.classList.toggle('active');
                    
                    // Prevent body scroll when menu is open
                    if (navMenu.classList.contains('active')) {
                        document.body.style.overflow = 'hidden';
                        console.log('Menu opened');
                    } else {
                        document.body.style.overflow = '';
                        console.log('Menu closed');
                    }
                });
                
                // Handle dropdown toggles on mobile
                dropdowns.forEach(dropdown => {
                    const dropdownToggle = dropdown.querySelector('a');
                    
                    if (dropdownToggle) {
                        dropdownToggle.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            console.log('Dropdown clicked');
                            
                            dropdown.classList.toggle('open');
                            
                            // Close other dropdowns
                            dropdowns.forEach(otherDropdown => {
                                if (otherDropdown !== dropdown) {
                                    otherDropdown.classList.remove('open');
                                }
                            });
                        });
                    }
                });
                
                // Close menu when clicking outside
                document.addEventListener('click', function(e) {
                    if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
                        hamburger.classList.remove('active');
                        navMenu.classList.remove('active');
                        document.body.style.overflow = '';
                        console.log('Menu closed by outside click');
                    }
                });
                
                // Close menu when clicking on a link
                navMenu.addEventListener('click', function(e) {
                    if (e.target.tagName === 'A') {
                        hamburger.classList.remove('active');
                        navMenu.classList.remove('active');
                        document.body.style.overflow = '';
                        console.log('Menu closed by link click');
                    }
                });
                
                // Handle window resize
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        hamburger.classList.remove('active');
                        navMenu.classList.remove('active');
                        document.body.style.overflow = '';
                        dropdowns.forEach(dropdown => {
                            dropdown.classList.remove('open');
                        });
                        console.log('Menu closed by resize');
                    }
                });
            } else {
                console.error('Mobile menu elements not found');
            }
        });
    </script>

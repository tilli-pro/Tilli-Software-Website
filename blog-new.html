    <script>
        // Blog page specific JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // Load blog posts data
            const postsData = JSON.parse(document.getElementById('blog-posts-data').textContent);
            const carousel = document.querySelector('.featured-post-carousel');
            const dotsContainer = document.querySelector('.carousel-dots');
            
            // Generate featured posts (latest 5 only)
            function generateFeaturedPosts() {
                // Clear loading message
                carousel.innerHTML = '';
                
                // Sort posts by date and get latest 5
                const sortedPosts = postsData.posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                const latestPosts = sortedPosts.slice(0, 5);
                
                console.log('Latest 5 posts:', latestPosts.map(p => p.title));
                
                latestPosts.forEach((post, index) => {
                    const postElement = document.createElement('div');
                    postElement.className = `featured-post ${index === 0 ? 'active' : ''}`;
                    postElement.setAttribute('data-post', index);
                    
                    postElement.innerHTML = `
                        <div class="featured-post-content">
                            <div class="featured-image">
                                <img src="${post.image}" alt="${post.title}">
                            </div>
                            <div class="featured-text">
                                <span class="latest-badge">LATEST</span>
                                <h2 class="featured-title">${post.title}</h2>
                                <p class="featured-description">${post.description}</p>
                                <div class="featured-actions">
                                    <a href="${post.href}" class="learn-more-btn">
                                        Learn More <i class="fas fa-arrow-right"></i>
                                    </a>
                                    <div class="author-info">
                                        <img src="Tilli Home Page/tilli-logo.png" alt="Tilli Software" class="author-avatar">
                                        <div class="author-details">
                                            <span class="author-name">${post.author}</span>
                                            <span class="read-time">5 min read</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    carousel.appendChild(postElement);
                });
                
                // Generate dots for latest 5 posts only
                latestPosts.forEach((post, index) => {
                    const dot = document.createElement('span');
                    dot.className = `dot ${index === 0 ? 'active' : ''}`;
                    dot.setAttribute('data-slide', index);
                    dotsContainer.appendChild(dot);
                });
            }
            
            // Initialize posts
            generateFeaturedPosts();
            
            // Wait a bit for DOM to update
            setTimeout(() => {
                // Featured Post Carousel
                const featuredPosts = document.querySelectorAll('.featured-post');
                const dots = document.querySelectorAll('.carousel-dots .dot');
                const prevArrow = document.querySelector('.prev-arrow');
                const nextArrow = document.querySelector('.next-arrow');
                let currentSlide = 0;
                const totalSlides = featuredPosts.length;
                
                console.log('Featured posts found:', featuredPosts.length);
                console.log('Dots found:', dots.length);
                
                if (featuredPosts.length === 0) {
                    console.error('No featured posts found!');
                    return;
                }

            function showSlide(index) {
                // Hide all posts
                featuredPosts.forEach(post => post.classList.remove('active'));
                // Show current post
                featuredPosts[index].classList.add('active');
                
                // Update dots
                dots.forEach(dot => dot.classList.remove('active'));
                dots[index].classList.add('active');
                
                // Update arrow states
                prevArrow.disabled = index === 0;
                nextArrow.disabled = index === totalSlides - 1;
            }

            function nextSlide() {
                if (currentSlide < totalSlides - 1) {
                    currentSlide++;
                    showSlide(currentSlide);
                }
            }

            function prevSlide() {
                if (currentSlide > 0) {
                    currentSlide--;
                    showSlide(currentSlide);
                }
            }

            // Event listeners
            nextArrow.addEventListener('click', nextSlide);
            prevArrow.addEventListener('click', prevSlide);

            // Dot navigation
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentSlide = index;
                    showSlide(currentSlide);
                });
            });

            // Auto-play (optional)
            setInterval(() => {
                if (currentSlide < totalSlides - 1) {
                    nextSlide();
                } else {
                    currentSlide = 0;
                    showSlide(currentSlide);
                }
            }, 5000);

                // Initialize
                showSlide(0);
            }, 100); // Small delay to ensure DOM is ready

            // Filter functionality
            const filterBtns = document.querySelectorAll('.filter-btn');
            const articlesGrid = document.querySelector('.articles-grid');
            let allPosts = postsData.posts;
            let currentFilter = 'all';

            // Generate articles dynamically
            function generateArticles(posts = allPosts) {
                // Clear existing articles
                const existingArticles = articlesGrid.querySelectorAll('.article-card');
                existingArticles.forEach(article => article.remove());

                // For "All" filter, show 4 different posts with different categories
                let displayPosts = posts;
                if (currentFilter === 'all') {
                    // Get unique categories and select one post from each
                    const categories = [...new Set(allPosts.map(post => post.category))];
                    displayPosts = [];
                    
                    // Select one post from each category (up to 4 categories)
                    for (let i = 0; i < Math.min(4, categories.length); i++) {
                        const categoryPosts = allPosts.filter(post => post.category === categories[i]);
                        if (categoryPosts.length > 0) {
                            displayPosts.push(categoryPosts[0]);
                        }
                    }
                }

                // Generate featured article (first post)
                if (displayPosts.length > 0) {
                    const featuredPost = displayPosts[0];
                    const featuredArticle = document.createElement('article');
                    featuredArticle.className = 'article-card featured-article';
                    featuredArticle.innerHTML = `
                        <a href="${featuredPost.href}" class="article-link">
                            <div class="article-image">
                                <img src="${featuredPost.image}" alt="${featuredPost.title}">
                            </div>
                            <div class="article-content">
                                <span class="article-category">${featuredPost.category.toUpperCase().replace('-', ' ')}</span>
                                <h3 class="article-title">${featuredPost.title}</h3>
                                <p class="article-excerpt">${featuredPost.description}</p>
                                <div class="article-meta">
                                    <span class="article-date">${featuredPost.date}</span>
                                </div>
                            </div>
                        </a>
                    `;
                    articlesGrid.appendChild(featuredArticle);
                }

                // Generate side articles (remaining posts, max 3)
                const sideArticles = displayPosts.slice(1, 4);
                if (sideArticles.length > 0) {
                    const sideArticlesContainer = document.createElement('div');
                    sideArticlesContainer.className = 'side-articles';
                    
                    sideArticles.forEach(post => {
                        const sideArticle = document.createElement('article');
                        sideArticle.className = 'article-card side-article';
                        sideArticle.innerHTML = `
                            <a href="${post.href}" class="article-link">
                                <div class="article-image">
                                    <img src="${post.image}" alt="${post.title}">
                                </div>
                                <div class="article-content">
                                    <span class="article-category">${post.category.toUpperCase().replace('-', ' ')}</span>
                                    <h3 class="article-title">${post.title}</h3>
                                    <div class="article-meta">
                                        <span class="article-date">${post.date}</span>
                                    </div>
                                </div>
                            </a>
                        `;
                        sideArticlesContainer.appendChild(sideArticle);
                    });
                    
                    articlesGrid.appendChild(sideArticlesContainer);
                }
            }

            // Initialize articles
            generateArticles();

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remove active class from all buttons
                    filterBtns.forEach(b => b.classList.remove('active'));
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    const filter = this.getAttribute('data-filter');
                    currentFilter = filter;
                    
                    // Filter posts based on category
                    let filteredPosts = allPosts;
                    if (filter !== 'all') {
                        filteredPosts = allPosts.filter(post => post.category === filter);
                    }
                    
                    // Generate filtered articles
                    generateArticles(filteredPosts);
                });
            });

            // Newsletter form
            const newsletterForm = document.querySelector('.newsletter-form');
            const newsletterInput = document.querySelector('.newsletter-input');
            const newsletterBtn = document.querySelector('.newsletter-btn');

            newsletterBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const email = newsletterInput.value;
                if (email && email.includes('@')) {
                    alert('Thank you for subscribing!');
                    newsletterInput.value = '';
                } else {
                    alert('Please enter a valid email address.');
                }
            });

            // Editor's Picks Carousel
            const editorsPicksContainer = document.getElementById('editors-picks-container');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            let currentPickIndex = 0;
            let autoScrollInterval;

            function generateEditorsPicks() {
                editorsPicksContainer.innerHTML = '';
                
                // Create two sets of posts for seamless infinite scroll (32 total cards)
                const postsToShow = [...allPosts, ...allPosts];
                
                console.log('Total posts to show:', postsToShow.length);
                console.log('All posts:', allPosts.length);
                
                postsToShow.forEach((post, index) => {
                    const pickCard = document.createElement('article');
                    pickCard.className = 'pick-card';
                    pickCard.style.flexShrink = '0'; // Ensure cards don't shrink
                    pickCard.innerHTML = `
                        <a href="${post.href}" class="pick-link">
                            <div class="pick-image">
                                <img src="${post.image}" alt="${post.title}">
                            </div>
                            <div class="pick-content">
                                <h3 class="pick-title">${post.title}</h3>
                                <div class="pick-meta">
                                    <span class="pick-author">${post.author}</span>
                                    <span class="pick-date">${post.date}</span>
                                    <span class="pick-read-time">5 min read</span>
                                </div>
                            </div>
                        </a>
                    `;
                    editorsPicksContainer.appendChild(pickCard);
                });
                
                // Force a reflow to ensure all cards are rendered
                editorsPicksContainer.offsetHeight;
            }

            // Initialize Editor's Picks
            generateEditorsPicks();
            updateScrollIndicator();
            
            // Debug: Log the actual number of cards created
            setTimeout(() => {
                const cards = editorsPicksContainer.querySelectorAll('.pick-card');
                console.log('Cards actually created:', cards.length);
                console.log('Container width:', editorsPicksContainer.scrollWidth);
                console.log('Viewport width:', editorsPicksContainer.clientWidth);
                console.log('All posts data:', allPosts);
                
                // If not enough cards, regenerate
                if (cards.length < 16) {
                    console.log('Regenerating posts...');
                    generateEditorsPicks();
                }
            }, 100);

            // Manual navigation with scroll functionality
            let isPaused = false;
            let currentScrollPosition = 0;
            let currentPostIndex = 1;
            const cardWidth = 280 + 24; // 280px card + 24px gap (1.5rem)
            const totalPosts = allPosts.length;
            
            function updateScrollIndicator() {
                document.getElementById('current-post').textContent = currentPostIndex;
                document.getElementById('total-posts').textContent = totalPosts;
            }
            
            function scrollToNext() {
                currentScrollPosition += cardWidth;
                const maxScroll = editorsPicksContainer.scrollWidth - editorsPicksContainer.clientWidth;
                if (currentScrollPosition >= maxScroll) {
                    currentScrollPosition = 0;
                    currentPostIndex = 1;
                } else {
                    currentPostIndex = Math.min(currentPostIndex + 1, totalPosts);
                }
                editorsPicksContainer.scrollTo({
                    left: currentScrollPosition,
                    behavior: 'smooth'
                });
                updateScrollIndicator();
            }
            
            function scrollToPrev() {
                currentScrollPosition -= cardWidth;
                if (currentScrollPosition < 0) {
                    const maxScroll = editorsPicksContainer.scrollWidth - editorsPicksContainer.clientWidth;
                    currentScrollPosition = maxScroll;
                    currentPostIndex = totalPosts;
                } else {
                    currentPostIndex = Math.max(currentPostIndex - 1, 1);
                }
                editorsPicksContainer.scrollTo({
                    left: currentScrollPosition,
                    behavior: 'smooth'
                });
                updateScrollIndicator();
            }
            
            nextBtn.addEventListener('click', () => {
                editorsPicksContainer.style.animationPlayState = 'paused';
                isPaused = true;
                scrollToNext();
            });

            prevBtn.addEventListener('click', () => {
                editorsPicksContainer.style.animationPlayState = 'paused';
                isPaused = true;
                scrollToPrev();
            });

            // Pause on hover, resume on mouse leave
            editorsPicksContainer.addEventListener('mouseenter', () => {
                editorsPicksContainer.style.animationPlayState = 'paused';
            });

            editorsPicksContainer.addEventListener('mouseleave', () => {
                if (!isPaused) {
                    editorsPicksContainer.style.animationPlayState = 'running';
                }
            });

            // Add double-click to resume animation
            editorsPicksContainer.addEventListener('dblclick', () => {
                editorsPicksContainer.style.animationPlayState = 'running';
                isPaused = false;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitive Compare Pages 2 - Nudge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #060606;
            line-height: 1.5;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero-section {
            padding: 133px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 878px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-family: 'Sora', sans-serif;
            font-size: 29px;
            font-weight: 400;
            line-height: 36.54px;
            color: #060606;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 16px;
            font-weight: 400;
            line-height: 23px;
            color: #060606;
            margin-bottom: 48px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 58px 92px;
            margin-bottom: 48px;
            max-width: 414px;
            margin-left: auto;
            margin-right: auto;
        }

        .comparison-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .comparison-logo {
            width: 123px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .comparison-title {
            font-size: 16px;
            font-weight: 400;
            line-height: 23px;
            color: #060606;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .arrow-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-icon svg {
            width: 6px;
            height: 6px;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            position: relative;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6BD2F5 0%, #5C9CF5 65.07%, #2E67F8 100%);
            color: #ffffff;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary {
            background: #ffffff;
            color: #060606;
            border: 1px solid #E5E5E5;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
        }

        .background-decoration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 661px;
            height: 661px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0.96%, rgba(75, 132, 246, 0.5) 38.46%, rgba(44, 77, 144, 0.5) 100%);
            border-radius: 50%;
            filter: blur(624px);
            z-index: 1;
            opacity: 0.5;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: #CCCCCC;
        }

        .star:nth-child(1) { top: 20%; left: 10%; font-size: 14px; }
        .star:nth-child(2) { top: 30%; right: 15%; font-size: 21px; }
        .star:nth-child(3) { bottom: 25%; left: 20%; font-size: 56px; }
        .star:nth-child(4) { top: 15%; left: 50%; font-size: 28px; }
        .star:nth-child(5) { top: 5%; left: 30%; font-size: 16px; }
        .star:nth-child(6) { bottom: 15%; right: 25%; font-size: 28px; }
        .star:nth-child(7) { top: 10%; right: 5%; font-size: 14px; }
        .star:nth-child(8) { bottom: 35%; right: 10%; font-size: 14px; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            .hero-section {
                padding: 80px 0;
            }

            .hero-title {
                font-size: 24px;
                line-height: 30px;
            }

            .hero-subtitle {
                font-size: 14px;
                line-height: 20px;
            }

            .comparison-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .cta-buttons {
                flex-direction: column;
                gap: 16px;
            }

            .btn {
                width: 100%;
                max-width: 280px;
            }

            .background-decoration {
                width: 400px;
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 20px;
                line-height: 26px;
            }

            .comparison-logo {
                width: 100px;
                height: 26px;
            }

            .comparison-title {
                font-size: 14px;
                line-height: 20px;
            }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Tilli Software</title>
    <meta name="description" content="Sign in to your Tilli account to access Nudge, tilliPay, tilliX and more.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- OAuth SDKs -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            min-height: 100vh;
        }
        .signin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }
        .signin-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            padding: 48px;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-section img {
            height: 50px;
            margin-bottom: 16px;
        }
        .logo-section h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 8px 0;
        }
        .logo-section p {
            color: #64748b;
            font-size: 16px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #5B9EFF;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        .forgot-password {
            color: #5B9EFF;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .btn-signin {
            width: 100%;
            padding: 14px;
            background: #5B9EFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-signin:hover {
            background: #4088ee;
        }
        .btn-signin:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: #94a3b8;
            font-size: 14px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider span {
            padding: 0 16px;
        }
        .social-signin {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-social {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-social:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .btn-social:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-social svg {
            width: 20px;
            height: 20px;
        }
        .signup-link {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
        }
        .signup-link a {
            color: #5B9EFF;
            text-decoration: none;
            font-weight: 600;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }
        .error-message.active {
            display: block;
        }
        .success-message {
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #5B9EFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <div class="logo">
                    <a href="index.html">
                        <img src="Images/22_tilli_logo_color.png" alt="Tilli" style="height: 40px;">
                    </a>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html#products">Products</a></li>
                    <li><a href="industries.html">Industries</a></li>
                    <li><a href="use-cases.html">Use Cases</a></li>
                    <li><a href="about.html">Company</a></li>
                    <li><a href="valuebasedpricing.html">Pricing</a></li>
                    <li><a href="press.html">Press</a></li>
                </ul>
                <div class="nav-actions">
                    <a class="btn-outline" href="signin.html">Sign In</a>
                    <a class="cta-button" href="signup.html">Sign Up</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="signin-container">
        <div class="signin-box">
            <div class="logo-section">
                <img src="Images/22_tilli_logo_color.png" alt="Tilli">
                <h1>Welcome Back</h1>
                <p>Sign in to access your Tilli applications</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Signing you in...</p>
            </div>

            <div id="signin-content">
                <form id="signinForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="you@company.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-signin" id="submitBtn">Sign In</button>
                </form>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-signin">
                    <button class="btn-social" id="googleSignin" onclick="signInWithGoogle()">
                        <svg width="20" height="20" viewBox="0 0 20 20">
                            <path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
                            <path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/>
                            <path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/>
                            <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/>
                        </svg>
                        Continue with Google
                    </button>

                    <button class="btn-social" id="microsoftSignin" onclick="signInWithMicrosoft()">
                        <svg width="20" height="20" viewBox="0 0 20 20">
                            <path fill="#f35325" d="M0 0h9.5v9.5H0z"/>
                            <path fill="#81bc06" d="M10.5 0H20v9.5h-9.5z"/>
                            <path fill="#05a6f0" d="M0 10.5h9.5V20H0z"/>
                            <path fill="#ffba08" d="M10.5 10.5H20V20h-9.5z"/>
                        </svg>
                        Continue with Microsoft
                    </button>

                    <button class="btn-social" id="githubSignin" onclick="signInWithGitHub()">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 0C4.477 0 0 4.484 0 10.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0110 4.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.942.359.31.678.921.678 1.856 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0020 10.017C20 4.484 15.522 0 10 0z" clip-rule="evenodd"/>
                        </svg>
                        Continue with GitHub
                    </button>
                </div>
            </div>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign up for free</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:5001'
            : 'https://api.tillisoftware.com';

        const GOOGLE_CLIENT_ID = '759194224766-frl99u4e1cb1dvm815jpqf9oej72li4h.apps.googleusercontent.com';
        const MICROSOFT_CLIENT_ID = '6163434b-559b-45f0-a7b2-6afb60b4431f';

        function showLoading() {
            document.getElementById('signin-content').style.display = 'none';
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('signin-content').style.display = 'block';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            hideLoading();
        }

        // Handle traditional email/password signin
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Clear previous errors
            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                // TODO: Implement email/password authentication with Nudge API
                // For now, show error message
                throw new Error('Email/password sign-in is not yet implemented. Please use OAuth buttons below.');

            } catch (error) {
                errorMessage.textContent = error.message || 'Invalid email or password';
                errorMessage.classList.add('active');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        // Google OAuth Handler
        async function handleGoogleCallback(response) {
            try {
                console.log('Google sign-in successful, sending to Nudge API...');

                // Send ID token to Nudge API
                const apiResponse = await fetch(`${API_BASE_URL}/api/v2/OAuth/Google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: response.credential })
                });

                const data = await apiResponse.json();
                console.log('Nudge API response:', data);

                if (data.data && data.data.success) {
                    // Redirect to portal dashboard
                    console.log('Redirecting to:', data.data.redirectUrl);
                    window.location.href = data.data.redirectUrl;
                } else {
                    showError('OAuth sign-in failed. Please try again.');
                }
            } catch (error) {
                console.error('Google OAuth error:', error);
                showError('Failed to sign in with Google. Please try again.');
            } finally {
                hideLoading();
            }
        }

        // Google OAuth - Initialize on page load
        let googleInitialized = false;

        function initializeGoogle() {
            if (googleInitialized) return;

            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCallback,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                googleInitialized = true;
                console.log('✅ Google Sign-In initialized');
            } catch (error) {
                console.error('Google initialization error:', error);
            }
        }

        // Initialize when Google SDK loads
        window.onload = function() {
            if (typeof google !== 'undefined' && google.accounts) {
                initializeGoogle();
            }
        };

        window.signInWithGoogle = async function() {
            showLoading();

            try {
                if (!googleInitialized) {
                    initializeGoogle();
                }

                // Use renderButton approach with a hidden div
                const buttonDiv = document.createElement('div');
                buttonDiv.id = 'google-signin-button';
                buttonDiv.style.position = 'absolute';
                buttonDiv.style.left = '-9999px';
                document.body.appendChild(buttonDiv);

                google.accounts.id.renderButton(buttonDiv, {
                    type: 'standard',
                    theme: 'outline',
                    size: 'large'
                });

                // Trigger click programmatically
                setTimeout(() => {
                    const googleButton = buttonDiv.querySelector('div[role="button"]');
                    if (googleButton) {
                        googleButton.click();
                    } else {
                        // Fallback to prompt
                        google.accounts.id.prompt((notification) => {
                            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                console.warn('Google prompt not displayed:', notification.getNotDisplayedReason());
                                hideLoading();
                                showError('Please enable popups and try again, or configure Google OAuth for localhost:8000');
                            }
                        });
                    }
                }, 100);

            } catch (error) {
                console.error('Google sign-in error:', error);
                showError('Failed to initialize Google sign-in. Please try again.');
                hideLoading();
            }
        };

        // Microsoft OAuth
        window.signInWithMicrosoft = async function() {
            showLoading();

            try {
                // Initialize MSAL
                const msalConfig = {
                    auth: {
                        clientId: MICROSOFT_CLIENT_ID,
                        authority: 'https://login.microsoftonline.com/common',
                        redirectUri: window.location.origin
                    }
                };

                const msalInstance = new msal.PublicClientApplication(msalConfig);
                await msalInstance.initialize();

                const loginResponse = await msalInstance.loginPopup({
                    scopes: ['user.read']
                });

                console.log('Microsoft sign-in successful, sending to Nudge API...');

                // Send access token to Nudge API
                const apiResponse = await fetch(`${API_BASE_URL}/api/v2/OAuth/Microsoft`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessToken: loginResponse.accessToken })
                });

                const data = await apiResponse.json();
                console.log('Nudge API response:', data);

                if (data.data && data.data.success) {
                    console.log('Redirecting to:', data.data.redirectUrl);
                    window.location.href = data.data.redirectUrl;
                } else {
                    showError('OAuth sign-in failed. Please try again.');
                }
            } catch (error) {
                console.error('Microsoft OAuth error:', error);
                showError('Failed to sign in with Microsoft. Please try again.');
            } finally {
                hideLoading();
            }
        };

        // GitHub OAuth
        window.signInWithGitHub = async function() {
            showLoading();
            // GitHub OAuth requires server-side flow - to be implemented
            showError('GitHub sign-in is coming soon!');
        };

        // Check for error in URL params
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessages = {
                'oauth_failed': 'OAuth authentication failed. Please try again.',
                'invalid_token': 'Invalid or expired session. Please sign in again.',
                'access_denied': 'Access denied. Please try again.'
            };
            showError(errorMessages[error] || 'An error occurred. Please try again.');
        }

        console.log('✅ Tilli Software - Sign In Page Loaded');
        console.log('📍 Nudge API URL:', API_BASE_URL);
        console.log('🔑 Google Client ID:', GOOGLE_CLIENT_ID);
    </script>
</body>
</html>

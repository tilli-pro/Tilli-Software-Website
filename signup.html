<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tilli Software</title>

    <!-- OAuth SDKs -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 48px;
            max-width: 480px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo img {
            height: 48px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            text-align: center;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 40px;
        }

        .oauth-btn {
            width: 100%;
            padding: 14px 24px;
            margin-bottom: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .oauth-btn:hover {
            background: #f9fafb;
            border-color: #4099FF;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 153, 255, 0.2);
        }

        .oauth-btn svg {
            width: 20px;
            height: 20px;
        }

        .separator {
            display: flex;
            align-items: center;
            margin: 32px 0;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .separator span {
            padding: 0 16px;
            font-size: 14px;
            color: #6b7280;
        }

        .magic-link-form {
            margin-bottom: 24px;
        }

        .magic-link-form input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .magic-link-form input:focus {
            outline: none;
            border-color: #4099FF;
        }

        .btn-primary {
            width: 100%;
            background: #4099FF;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 153, 255, 0.3);
        }

        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 14px;
            color: #6b7280;
        }

        .footer a {
            color: #4099FF;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4099FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            padding: 12px 16px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4099FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <h1>Welcome to Tilli Software</h1>
        <p class="subtitle">Sign up to get started with intelligent business automation</p>

        <!-- Error Message -->
        <div id="error-message" class="error-message"></div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Signing you in...</p>
        </div>

        <!-- OAuth Buttons -->
        <div id="oauth-buttons">
            <button class="oauth-btn" onclick="signInWithGoogle()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <button class="oauth-btn" onclick="signInWithMicrosoft()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#f25022" d="M1 1h10v10H1z"/>
                    <path fill="#00a4ef" d="M13 1h10v10H13z"/>
                    <path fill="#7fba00" d="M1 13h10v10H1z"/>
                    <path fill="#ffb900" d="M13 13h10v10H13z"/>
                </svg>
                Continue with Microsoft
            </button>

            <button class="oauth-btn" onclick="signInWithGitHub()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#181717">
                    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                Continue with GitHub
            </button>

            <!-- Separator -->
            <div class="separator">
                <span>or continue with email</span>
            </div>

            <!-- Magic Link Form -->
            <div class="magic-link-form">
                <input
                    type="email"
                    id="email-input"
                    placeholder="your@email.com"
                    onkeypress="if(event.key==='Enter') sendMagicLink()"
                />
                <button class="btn-primary" onclick="sendMagicLink()">
                    Send Magic Link
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Already have an account? <a href="http://localhost:4200/login">Sign in</a>
            <br><br>
            By signing up, you agree to our
            <a href="https://www.tillisoftware.com/terms">Terms of Service</a> and
            <a href="https://www.tillisoftware.com/privacy">Privacy Policy</a>
        </div>
    </div>

    <!-- Native OAuth Implementation -->
    <script>
        const API_BASE_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:5001'
            : 'https://api.tillisoftware.com';

        const GOOGLE_CLIENT_ID = '759194224766-frl99u4e1cb1dvm815jpqf9oej72li4h.apps.googleusercontent.com';
        const MICROSOFT_CLIENT_ID = '6163434b-559b-45f0-a7b2-6afb60b4431f';
        const GITHUB_CLIENT_ID = 'Ov23liNmFpmJiVUjNjyT';

        function showLoading() {
            document.getElementById('oauth-buttons').style.display = 'none';
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('oauth-buttons').style.display = 'block';
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            hideLoading();
        }

        // Google OAuth Handler
        async function handleGoogleCallback(response) {
            try {
                console.log('Google sign-in successful, sending to Nudge API...');

                // Send ID token to Nudge API
                const apiResponse = await fetch(`${API_BASE_URL}/api/v2/OAuth/Google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: response.credential })
                });

                const data = await apiResponse.json();
                console.log('Nudge API response:', data);

                if (data.data && data.data.success) {
                    // Redirect to welcome page
                    console.log('Redirecting to:', data.data.redirectUrl);
                    window.location.href = data.data.redirectUrl;
                } else {
                    showError('OAuth sign-in failed. Please try again.');
                }
            } catch (error) {
                console.error('Google OAuth error:', error);
                showError('Failed to sign in with Google. Please try again.');
            } finally {
                hideLoading();
            }
        }

        // Google OAuth - Initialize on page load
        let googleInitialized = false;

        function initializeGoogle() {
            if (googleInitialized) return;

            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCallback,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                googleInitialized = true;
                console.log('✅ Google Sign-In initialized');
            } catch (error) {
                console.error('Google initialization error:', error);
            }
        }

        // Initialize when Google SDK loads
        window.onload = function() {
            if (typeof google !== 'undefined' && google.accounts) {
                initializeGoogle();
            }
        };

        window.signInWithGoogle = async function() {
            showLoading();

            try {
                if (!googleInitialized) {
                    initializeGoogle();
                }

                // Use renderButton approach with a hidden div
                const buttonDiv = document.createElement('div');
                buttonDiv.id = 'google-signin-button';
                buttonDiv.style.position = 'absolute';
                buttonDiv.style.left = '-9999px';
                document.body.appendChild(buttonDiv);

                google.accounts.id.renderButton(buttonDiv, {
                    type: 'standard',
                    theme: 'outline',
                    size: 'large'
                });

                // Trigger click programmatically
                setTimeout(() => {
                    const googleButton = buttonDiv.querySelector('div[role="button"]');
                    if (googleButton) {
                        googleButton.click();
                    } else {
                        // Fallback to prompt
                        google.accounts.id.prompt((notification) => {
                            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                console.warn('Google prompt not displayed:', notification.getNotDisplayedReason());
                                hideLoading();
                                showError('Please enable popups and try again, or configure Google OAuth for localhost:8000');
                            }
                        });
                    }
                }, 100);

            } catch (error) {
                console.error('Google sign-in error:', error);
                showError('Failed to initialize Google sign-in. Please try again.');
                hideLoading();
            }
        };

        // Microsoft OAuth
        window.signInWithMicrosoft = async function() {
            showLoading();

            try {
                // Initialize MSAL
                const msalConfig = {
                    auth: {
                        clientId: MICROSOFT_CLIENT_ID,
                        authority: 'https://login.microsoftonline.com/common',
                        redirectUri: window.location.origin
                    }
                };

                const msalInstance = new msal.PublicClientApplication(msalConfig);
                await msalInstance.initialize();

                const loginResponse = await msalInstance.loginPopup({
                    scopes: ['user.read']
                });

                console.log('Microsoft sign-in successful, sending to Nudge API...');

                // Send access token to Nudge API
                const apiResponse = await fetch(`${API_BASE_URL}/api/v2/OAuth/Microsoft`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessToken: loginResponse.accessToken })
                });

                const data = await apiResponse.json();
                console.log('Nudge API response:', data);

                if (data.data && data.data.success) {
                    console.log('Redirecting to:', data.data.redirectUrl);
                    window.location.href = data.data.redirectUrl;
                } else {
                    showError('OAuth sign-in failed. Please try again.');
                }
            } catch (error) {
                console.error('Microsoft OAuth error:', error);
                showError('Failed to sign in with Microsoft. Please try again.');
            } finally {
                hideLoading();
            }
        };

        // GitHub OAuth
        window.signInWithGitHub = async function() {
            // GitHub OAuth uses authorization code flow
            const redirectUri = encodeURIComponent(`${window.location.origin}/github-callback.html`);
            const scope = encodeURIComponent('read:user user:email');

            // Redirect to GitHub OAuth authorization page
            window.location.href = `https://github.com/login/oauth/authorize?client_id=${GITHUB_CLIENT_ID}&redirect_uri=${redirectUri}&scope=${scope}`;
        };

        async function sendMagicLink() {
            const email = document.getElementById('email-input').value.trim();

            if (!email) {
                showError('Please enter your email address');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }

            showLoading();

            // Magic link functionality to be implemented
            showError('Magic link feature is coming soon! Please use OAuth buttons above.');

            document.getElementById('loading').classList.remove('active');
            document.getElementById('oauth-buttons').style.display = 'block';
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // Check for error in URL params
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessages = {
                'oauth_failed': 'OAuth authentication failed. Please try again.',
                'invalid_token': 'Invalid or expired session. Please sign in again.',
                'access_denied': 'Access denied. Please try again.'
            };
            showError(errorMessages[error] || 'An error occurred. Please try again.');
        }

        console.log('✅ Tilli Software - OAuth Signup Page Loaded');
        console.log('📍 Nudge API URL:', API_BASE_URL);
        console.log('🔑 Google Client ID:', GOOGLE_CLIENT_ID);
    </script>

    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
